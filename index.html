<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゴルフ予約管理</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --green: #2e7d4f;
    --green-dark: #1f5c39;
    --bg: #f4f6f4;
    --card: #ffffff;
    --border: #dfe4df;
    --text: #26302a;
    --muted: #6b756f;
    --danger: #c0392b;
    --warn-bg: #fff4e5;
    --warn-text: #9a6400;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 20px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.9;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--green-dark);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  input[type="date"], input[type="time"], input[type="text"], input[type="datetime-local"], select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  .course-tag {
    display: inline-block;
    font-size: 12px;
    color: #fff;
    background: var(--green);
    padding: 2px 9px;
    border-radius: 999px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .full-width { grid-column: 1 / -1; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-size: 14px; color: var(--text); }
  .form-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 14px;
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-secondary { background: #eceeec; color: var(--text); }
  .btn-secondary:hover { background: #dde1dd; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tab-btn {
    background: #eceeec;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
  }
  .tab-btn.active { background: var(--green); color: #fff; }
  .res-list { display: flex; flex-direction: column; gap: 10px; }
  .res-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .res-item.past { opacity: 0.55; }
  .res-main .date-line {
    font-size: 15px;
    font-weight: 600;
    color: var(--green-dark);
  }
  .res-main .sub-line {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .badge {
    display: inline-block;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .res-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 6px;
  }
  .icon-btn:hover { background: #f0f1f0; }
  .icon-btn.delete:hover { color: var(--danger); border-color: var(--danger); }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 30px 0;
  }
  .gcal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .gcal-status {
    font-size: 13px;
    color: var(--muted);
  }
  .gcal-status.connected { color: var(--green-dark); font-weight: 600; }
  .gcal-actions { display: flex; gap: 8px; }
  .sync-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--green-dark);
    background: #e6f2ea;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .status-pill {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .status-pill.pending { background: #fdecea; color: #a13a2d; }
  .calljob-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .calljob-badge.scheduled { background: #eef2fb; color: #33518f; }
  .calljob-badge.dialing { background: #fff4e5; color: #9a6400; }
  .calljob-badge.connected { background: #e6f2ea; color: #1f5c39; }
  .calljob-badge.failed { background: #fdecea; color: #a13a2d; }
  .calljob-badge.cancelled { background: #eceeec; color: #6b756f; }
  .autodial-box {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    background: #fbfcfb;
  }
  .autodial-box .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .settings-grid h3 {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--green-dark);
    margin: 10px 0 0;
  }
  .settings-grid .hint {
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>ゴルフ予約管理</h1>
  <p>チェックメイトCC・太平洋クラブ・横浜カントリークラブなど、複数のゴルフ場の予約をまとめて記録・管理</p>
</header>

<main>
  <div class="card">
    <h2>Googleカレンダー連携</h2>
    <div class="gcal-row">
      <div class="gcal-status" id="gcalStatus">未接続です</div>
      <div class="gcal-actions">
        <button class="btn-secondary" id="gcalConnectBtn">Googleカレンダーに接続</button>
        <button class="btn-secondary" id="gcalSyncBtn" style="display:none;">Googleカレンダーから最新を取得</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>自動予約電話 設定</h2>
    <div class="form-grid">
      <div class="full-width">
        <label for="apiBaseUrlInput">バックエンドAPIのURL（自動発信システムのエンドポイント。デプロイ後に発行されるURLを入力）</label>
        <input type="text" id="apiBaseUrlInput" placeholder="例: https://xxxxxxxxxx.execute-api.ap-northeast-1.amazonaws.com">
      </div>
    </div>
    <div class="settings-grid">
      <h3>チェックメイトCC</h3>
      <div class="full-width">
        <label for="cm_phone">ゴルフ場電話番号（E.164形式）</label>
        <input type="text" id="cm_phone" placeholder="+81465xxxxxxx">
      </div>
      <div class="full-width hint">予約開始ルール（固定・編集不要）: 平日・祝日は2ヶ月前の同日10:00／土日は1ヶ月前の同日10:00。</div>

      <h3>太平洋クラブ（御殿場コース）</h3>
      <div class="full-width">
        <label for="tc_phone">ゴルフ場電話番号（E.164形式）</label>
        <input type="text" id="tc_phone" placeholder="+81550xxxxxxx">
      </div>
      <div class="full-width hint">予約開始ルール（固定・編集不要）: 通常は3ヶ月前の同日10:00。競技（コンペ）の場合のみ1ヶ月前の同日10:00（予約フォームの「競技ラウンド」チェックで切り替え）。</div>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="saveCallSettingsBtn">自動発信設定を保存</button>
    </div>
  </div>

  <div class="card">
    <h2 id="form-title">予約を追加</h2>
    <div class="form-grid">
      <div class="full-width">
        <label for="courseSelect">ゴルフ場</label>
        <select id="courseSelect">
          <option value="">選択してください</option>
          <option value="チェックメイトCC">チェックメイトCC</option>
          <option value="太平洋クラブ">太平洋クラブ</option>
          <option value="横浜カントリークラブ">横浜カントリークラブ</option>
          <option value="__custom__">その他（自由入力）</option>
        </select>
      </div>
      <div class="full-width" id="courseCustomWrap" style="display:none;">
        <label for="courseCustom">ゴルフ場名を入力</label>
        <input type="text" id="courseCustom" placeholder="例: 〇〇カントリークラブ">
      </div>
      <div>
        <label for="playDate">プレー日</label>
        <input type="date" id="playDate">
      </div>
      <div>
        <label for="startTime">スタート時間</label>
        <input type="time" id="startTime">
      </div>
      <div>
        <label for="player1">プレーヤー1</label>
        <input type="text" id="player1" placeholder="例: 定国直樹">
      </div>
      <div>
        <label for="player2">プレーヤー2</label>
        <input type="text" id="player2" placeholder="例: 山田さん">
      </div>
      <div>
        <label for="player3">プレーヤー3</label>
        <input type="text" id="player3" placeholder="例: 佐藤さん">
      </div>
      <div>
        <label for="player4">プレーヤー4</label>
        <input type="text" id="player4" placeholder="例: 鈴木さん">
      </div>
      <div class="full-width">
        <div class="checkbox-row">
          <input type="checkbox" id="timeChangeRequested">
          <label for="timeChangeRequested">時間変更依頼あり</label>
        </div>
      </div>
      <div class="full-width" id="timeChangeNoteWrap" style="display:none;">
        <label for="timeChangeNote">変更依頼の内容・希望時間など</label>
        <input type="text" id="timeChangeNote" placeholder="例: 9:00台に変更希望、連絡済み">
      </div>
      <div class="full-width">
        <label>ステータス</label>
        <div class="checkbox-row">
          <label style="margin-right:16px; font-size:14px; display:flex; align-items:center; gap:4px;">
            <input type="radio" name="resStatus" id="statusConfirmed" value="confirmed" checked> 確定済み予約
          </label>
          <label style="font-size:14px; display:flex; align-items:center; gap:4px;">
            <input type="radio" name="resStatus" id="statusPending" value="pending"> 未予約（枠を確保したい）
          </label>
        </div>
      </div>
      <div class="full-width autodial-box" id="autoDialSection" style="display:none;">
        <div class="checkbox-row" id="competitionRow" style="display:none;">
          <input type="checkbox" id="autoDialCompetition">
          <label for="autoDialCompetition">競技（コンペ）ラウンド（御殿場コースは1ヶ月前開始になります）</label>
        </div>
        <label for="autoDialOpenDateTime">予約開始日時（固定ルールから自動計算。実際と異なる場合のみ修正してください）</label>
        <input type="datetime-local" id="autoDialOpenDateTime">
        <div class="checkbox-row" style="margin-top:8px;">
          <input type="checkbox" id="autoDialEnabled">
          <label for="autoDialEnabled">自動で予約電話を発信する</label>
        </div>
        <div class="hint" id="autoDialJobStatus"></div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" id="saveBtn">追加する</button>
      <button class="btn-secondary" id="cancelBtn" style="display:none;">キャンセル</button>
    </div>
  </div>

  <div class="card">
    <h2>予約一覧</h2>
    <div class="filter-row">
      <div class="tabs">
        <button class="tab-btn active" data-filter="upcoming">今後の予約</button>
        <button class="tab-btn" data-filter="all">すべて</button>
        <button class="tab-btn" data-filter="pending">未予約</button>
        <button class="tab-btn" data-filter="changeRequested">変更依頼あり</button>
      </div>
      <select id="courseFilter">
        <option value="">すべてのゴルフ場</option>
      </select>
    </div>
    <div class="res-list" id="resList"></div>
    <div class="empty" id="emptyMsg" style="display:none;">予約はまだありません</div>
  </div>
</main>

<script>
const STORAGE_KEY = "checkmatecc_reservations";
let editingId = null;
let currentFilter = "upcoming";
let currentCourseFilter = "";

// ---- 自動予約電話（Twilio自動発信）関連 ----
// 対象コース: この2つの場合のみ「未予約」ステータスで自動発信チェックが使える
const TARGET_COURSES = ["チェックメイトCC", "太平洋クラブ"];
// 競技（コンペ）による例外ルールがあるコース
const COMPETITION_ELIGIBLE_COURSES = ["太平洋クラブ"];
const API_BASE_KEY = "golf_call_api_base_url";
const COURSE_PHONE_KEY = "golf_course_phone_numbers_v1";

// 予約開始ルール（固定値。ユーザーからの確認済みルールのためUIでは編集不可にしている）
// - チェックメイトCC: 平日・祝日は2ヶ月前の同日10:00 / 土日は1ヶ月前の同日10:00
// - 太平洋クラブ御殿場: 通常は3ヶ月前の同日10:00 / 競技(コンペ)は1ヶ月前の同日10:00
const COURSE_RULES = {
  "チェックメイトCC": { weekdayMonthsBefore: 2, weekendMonthsBefore: 1, timeOfDay: "10:00" },
  "太平洋クラブ": { weekdayMonthsBefore: 3, weekendMonthsBefore: 3, competitionMonthsBefore: 1, timeOfDay: "10:00" }
};

// エントリーデスクの電話番号（初期値）。localStorageに未保存の場合のフォールバックとして使う。
const DEFAULT_COURSE_PHONES = {
  "チェックメイトCC": "+81465837311",
  "太平洋クラブ": "+81550896226"
};

function loadCoursePhones() {
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(COURSE_PHONE_KEY)) || {};
  } catch (e) {
    saved = {};
  }
  return {
    "チェックメイトCC": saved["チェックメイトCC"] || DEFAULT_COURSE_PHONES["チェックメイトCC"],
    "太平洋クラブ": saved["太平洋クラブ"] || DEFAULT_COURSE_PHONES["太平洋クラブ"]
  };
}

function saveCoursePhones(phones) {
  localStorage.setItem(COURSE_PHONE_KEY, JSON.stringify(phones));
}

function loadApiBaseUrl() {
  return (localStorage.getItem(API_BASE_KEY) || "").trim().replace(/\/$/, "");
}

function saveApiBaseUrl(url) {
  localStorage.setItem(API_BASE_KEY, (url || "").trim().replace(/\/$/, ""));
}

function initCallSettingsUI() {
  const phones = loadCoursePhones();
  document.getElementById("apiBaseUrlInput").value = loadApiBaseUrl();
  document.getElementById("cm_phone").value = phones["チェックメイトCC"] || "";
  document.getElementById("tc_phone").value = phones["太平洋クラブ"] || "";
}

document.getElementById("saveCallSettingsBtn").addEventListener("click", () => {
  saveApiBaseUrl(document.getElementById("apiBaseUrlInput").value);
  saveCoursePhones({
    "チェックメイトCC": document.getElementById("cm_phone").value.trim(),
    "太平洋クラブ": document.getElementById("tc_phone").value.trim()
  });
  alert("自動発信設定を保存しました。");
});

// プレー日・競技フラグと、コースの固定ルールから「予約開始日時」を自動計算する
// (datetime-local用のローカル文字列を返す)
function calcOpenDateTimeLocal(course, playDate, isCompetition) {
  const rule = COURSE_RULES[course];
  if (!rule || !playDate) return "";
  const [y, m, d] = playDate.split("-").map(Number);
  const base = new Date(y, m - 1, d);
  const dow = base.getDay(); // 0:日 ... 6:土
  const isWeekend = dow === 0 || dow === 6;

  let monthsBefore;
  if (isCompetition && rule.competitionMonthsBefore != null) {
    monthsBefore = rule.competitionMonthsBefore;
  } else {
    monthsBefore = isWeekend ? rule.weekendMonthsBefore : rule.weekdayMonthsBefore;
  }

  base.setMonth(base.getMonth() - (Number(monthsBefore) || 0));
  const yyyy = base.getFullYear();
  const MM = String(base.getMonth() + 1).padStart(2, "0");
  const dd = String(base.getDate()).padStart(2, "0");
  const time = rule.timeOfDay || "10:00";
  return `${yyyy}-${MM}-${dd}T${time}`;
}

// datetime-local の値 ("YYYY-MM-DDTHH:mm") を、日本時間固定のISO文字列に変換してバックエンドに送る
function localDateTimeToJstIso(localStr) {
  if (!localStr) return null;
  return `${localStr}:00+09:00`;
}

function jstIsoToLocalInputValue(iso) {
  if (!iso) return "";
  return iso.replace("+09:00", "").slice(0, 16);
}

function updateAutoDialVisibility() {
  const course = getCourseValue();
  const statusEl = document.querySelector('input[name="resStatus"]:checked');
  const status = statusEl ? statusEl.value : "confirmed";
  const section = document.getElementById("autoDialSection");
  const competitionRow = document.getElementById("competitionRow");
  if (status === "pending" && TARGET_COURSES.includes(course)) {
    section.style.display = "block";
    competitionRow.style.display = COMPETITION_ELIGIBLE_COURSES.includes(course) ? "flex" : "none";
    if (!editingId) recomputeAutoDialDateTime();
  } else {
    section.style.display = "none";
  }
}

function recomputeAutoDialDateTime() {
  const course = getCourseValue();
  const playDate = document.getElementById("playDate").value;
  const isCompetition = document.getElementById("autoDialCompetition").checked;
  const dt = calcOpenDateTimeLocal(course, playDate, isCompetition);
  if (dt) document.getElementById("autoDialOpenDateTime").value = dt;
}

document.querySelectorAll('input[name="resStatus"]').forEach(r => {
  r.addEventListener("change", updateAutoDialVisibility);
});
document.getElementById("autoDialCompetition").addEventListener("change", recomputeAutoDialDateTime);

// バックエンドAPIに発信ジョブを登録/解除する。
// 戻り値は更新済みの予約オブジェクト (callJobId / callJobStatus / autoDialEnabled を反映)。
async function syncAutoDialJob(reservation) {
  const apiBase = loadApiBaseUrl();

  if (reservation.autoDialEnabled) {
    if (reservation.callJobId) {
      // 既に登録済み。開始日時などを変えたい場合は一旦チェックを外して解除し、再度チェックしてください。
      return reservation;
    }
    if (!apiBase) {
      alert("自動発信を有効にするには、上部の「自動予約電話 設定」でバックエンドAPIのURLを設定してください。");
      return Object.assign({}, reservation, { autoDialEnabled: false });
    }
    const phones = loadCoursePhones();
    const phone = phones[reservation.course];
    if (!phone) {
      alert(`${reservation.course}の電話番号が未設定です。「自動予約電話 設定」で入力してください。`);
      return Object.assign({}, reservation, { autoDialEnabled: false });
    }
    if (!reservation.autoDialOpenDateTime) {
      alert("予約開始日時が入力されていません。");
      return Object.assign({}, reservation, { autoDialEnabled: false });
    }
    try {
      const res = await fetch(`${apiBase}/jobs`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          course: reservation.course,
          playDate: reservation.playDate,
          openDateTimeIso: reservation.autoDialOpenDateTime,
          coursePhoneNumber: phone,
          reservationId: reservation.id
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert("自動発信の登録に失敗しました: " + (data.error || res.status));
        return Object.assign({}, reservation, { autoDialEnabled: false });
      }
      return Object.assign({}, reservation, { callJobId: data.jobId, callJobStatus: data.status });
    } catch (e) {
      alert("自動発信バックエンドへの接続に失敗しました。APIのURLを確認してください。");
      return Object.assign({}, reservation, { autoDialEnabled: false });
    }
  } else if (reservation.callJobId) {
    // チェックを外した場合は登録済みジョブをキャンセルする
    try {
      if (apiBase) {
        await fetch(`${apiBase}/jobs/${reservation.callJobId}`, { method: "DELETE" });
      }
    } catch (e) {
      // 解除に失敗しても致命的ではないため無視する
    }
    return Object.assign({}, reservation, { callJobId: null, callJobStatus: null });
  }

  return reservation;
}

async function refreshJobStatus(id) {
  const apiBase = loadApiBaseUrl();
  let list = loadReservations();
  const r = list.find(x => x.id === id);
  if (!r || !r.callJobId) return;
  if (!apiBase) {
    alert("バックエンドAPIのURLが設定されていません。");
    return;
  }
  try {
    const res = await fetch(`${apiBase}/jobs/${r.callJobId}`);
    if (!res.ok) return;
    const data = await res.json();
    list = list.map(x => x.id === id ? Object.assign({}, x, { callJobStatus: data.status }) : x);
    saveReservations(list);
    render();
  } catch (e) {
    // ネットワークエラー等は無視 (ユーザーが再度「状況更新」を押せばよい)
  }
}

const GOOGLE_CLIENT_ID = "477050098248-osleutait6uvk1a7b14npjtjohdiu0q2.apps.googleusercontent.com";
const GOOGLE_SCOPE = "https://www.googleapis.com/auth/calendar.events";
const GCAL_ROUND_HOURS = 5; // ゴルフ1ラウンドの想定所要時間（カレンダー表示用）
let gcalToken = null;
let gcalTokenClient = null;

function updateGcalStatusUI() {

function initGoogleAuth() {
  if (typeof google === "undefined" || !google.accounts) {
    setTimeout(initGoogleAuth, 300);
    return;
  }
  gcalTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPE,
    callback: (resp) => {
      if (resp.error) {
        alert("Googleカレンダーへの接続に失敗しました: " + resp.error);
        return;
      }

function playersLine(r) {
  const players = (r.players || [r.companions || ""]).filter(n => n && n.trim());
  return players.length ? players.join("、") : "なし";
}

function toEventResource(r) {
  const startDateTime = `${r.playDate}T${r.startTime}:00`;
  const end = new Date(`${r.playDate}T${r.startTime}:00`);
  end.setHours(end.getHours() + GCAL_ROUND_HOURS);
  const pad = n => String(n).padStart(2, "0");
  const endDateTime = `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}T${pad(end.getHours())}:${pad(end.getMinutes())}:00`;
  const courseName = r.course && r.course.trim() ? r.course.trim() : "ゴルフ場未設定";
  let description = `ゴルフ場: ${courseName}\nプレーヤー: ${playersLine(r)}`;
  if (r.timeChangeRequested) {
    description += `\n時間変更依頼: ${r.timeChangeNote || "あり"}`;
  }
  return {
    summary: `${courseName} ゴルフ ${r.startTime}〜`,
    description,
    start: { dateTime: startDateTime, timeZone: "Asia/Tokyo" },
    end: { dateTime: endDateTime, timeZone: "Asia/Tokyo" },
    extendedProperties: { private: { checkmateccApp: "true" } }
  };
}

async function pushToCalendar(reservation) {
  if (!gcalToken) return reservation.gcalEventId || null;
  const event = toEventResource(reservation);
  const url = reservation.gcalEventId
    ? `https://www.googleapis.com/calendar/v3/calendars/primary/events/${reservation.gcalEventId}`
    : `https://www.googleapis.com/calendar/v3/calendars/primary/events`;
  const method = reservation.gcalEventId ? "PATCH" : "POST";
  try {
    const res = await fetch(url, {
      method,
      headers: {
        "Authorization": `Bearer ${gcalToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(event)
    });
    if (res.status === 401) {
      gcalToken = null;
      updateGcalStatusUI();
      return reservation.gcalEventId || null;
    }
    if (!res.ok) return reservation.gcalEventId || null;
    const data = await res.json();
    return data.id;
  } catch (e) {
    return reservation.gcalEventId || null;
  }
}

async function deleteFromCalendar(eventId) {
  if (!gcalToken || !eventId) return;
  try {
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${gcalToken}` }
    });
  } catch (e) {
    // 削除に失敗しても致命的ではないので無視
  }
}

function parseEventDescription(desc) {
  const lines = (desc || "").split("\n");
  let players = ["", "", "", ""];
  let timeChangeRequested = false;
  let timeChangeNote = "";
  let course = "";
  lines.forEach(line => {
    if (line.startsWith("ゴルフ場: ")) {
      const val = line.replace("ゴルフ場: ", "").trim();
      course = val === "ゴルフ場未設定" ? "" : val;
    } else if (line.startsWith("プレーヤー: ")) {
      const val = line.replace("プレーヤー: ", "").trim();
      const names = val === "なし" ? [] : val.split("、");
      players = [names[0] || "", names[1] || "", names[2] || "", names[3] || ""];
    } else if (line.startsWith("時間変更依頼: ")) {
      timeChangeRequested = true;
      timeChangeNote = line.replace("時間変更依頼: ", "").trim();
    }
  });
  return { course, players, timeChangeRequested, timeChangeNote };
}

// Googleカレンダーを正として、ローカルの予約一覧をまるごと作り直す。
// 別の端末（iPhoneなど）で追加・変更された予約もここで反映される。
async function syncFromCalendar() {
  if (!gcalToken) return;
  const syncBtn = document.getElementById("gcalSyncBtn");
  const originalText = syncBtn.textContent;
  syncBtn.textContent = "同期中...";
  syncBtn.disabled = true;
  try {
    const timeMin = new Date();
    timeMin.setDate(timeMin.getDate() - 60);
    const timeMax = new Date();
    timeMax.setDate(timeMax.getDate() + 365);
    const params = new URLSearchParams({
      privateExtendedProperty: "checkmateccApp=true",
      timeMin: timeMin.toISOString(),
      timeMax: timeMax.toISOString(),
      singleEvents: "true",
      maxResults: "250"
    });
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?${params}`, {
      headers: { "Authorization": `Bearer ${gcalToken}` }
    });
    if (res.status === 401) {
      gcalToken = null;
      updateGcalStatusUI();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    const remoteEvents = (data.items || []).filter(ev => ev.start && ev.start.dateTime);

    let list = loadReservations();
    const remoteIds = new Set();

    remoteEvents.forEach(ev => {
      remoteIds.add(ev.id);
      const remoteDate = ev.start.dateTime.slice(0, 10);
      const remoteTime = ev.start.dateTime.slice(11, 16);
      const parsed = parseEventDescription(ev.description);
      const existing = list.find(r => r.gcalEventId === ev.id);
      if (existing) {
        existing.playDate = remoteDate;
        existing.startTime = remoteTime;
        existing.course = parsed.course;
        existing.players = parsed.players;
        existing.timeChangeRequested = parsed.timeChangeRequested;
        existing.timeChangeNote = parsed.timeChangeNote;
      } else {
        list.push({
          id: uid(),
          gcalEventId: ev.id,
          playDate: remoteDate,
          startTime: remoteTime,
          course: parsed.course,
          players: parsed.players,
          timeChangeRequested: parsed.timeChangeRequested,
          timeChangeNote: parsed.timeChangeNote,
          status: "confirmed"
        });
      }
    });

    // カレンダー側から削除された予約（取得範囲内）はローカルからも取り除く
    list = list.filter(r => !r.gcalEventId || remoteIds.has(r.gcalEventId));

    saveReservations(list);
    render();
  } finally {
    syncBtn.textContent = originalText;
    syncBtn.disabled = false;
  }
}

function loadReservations() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveReservations(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  const course = getCourseValue();
  const playDate = document.getElementById("playDate").value;
  const startTime = document.getElementById("startTime").value;
  const players = [
    document.getElementById("player1").value.trim(),
    document.getElementById("player2").value.trim(),
    document.getElementById("player3").value.trim(),
    document.getElementById("player4").value.trim()
  ];
  const timeChangeRequested = timeChangeCheckbox.checked;
  const timeChangeNote = document.getElementById("timeChangeNote").value.trim();
  const statusEl = document.querySelector('input[name="resStatus"]:checked');
  const status = statusEl ? statusEl.value : "confirmed";
  const autoDialWanted = status === "pending" && TARGET_COURSES.includes(course) && document.getElementById("autoDialEnabled").checked;
  const autoDialCompetition = TARGET_COURSES.includes(course) && document.getElementById("autoDialCompetition").checked;
  const autoDialOpenLocal = document.getElementById("autoDialOpenDateTime").value;
  const autoDialOpenDateTime = (status === "pending" && TARGET_COURSES.includes(course))
    ? localDateTimeToJstIso(autoDialOpenLocal)
    : null;

  if (!course) {
    alert("ゴルフ場を選択（または入力）してください。");
    return;
  }
  if (!playDate || !startTime) {
    alert("プレー日とスタート時間を入力してください。");
    return;
  }

  const saveBtn = document.getElementById("saveBtn");
  const originalLabel = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = "保存中...";

  let list = loadReservations();
  let targetReservation;

  if (editingId) {
    const existing = list.find(r => r.id === editingId) || {};
    targetReservation = Object.assign({}, existing, {
      course, playDate, startTime, players, timeChangeRequested, timeChangeNote,
      status, autoDialEnabled: autoDialWanted, autoDialOpenDateTime, autoDialCompetition
    });
  } else {
    targetReservation = {
      id: uid(),
      course, playDate, startTime, players, timeChangeRequested, timeChangeNote,
      status, autoDialEnabled: autoDialWanted, autoDialOpenDateTime, autoDialCompetition,
      callJobId: null, callJobStatus: null, gcalEventId: null
    };
  }

  // 自動発信の登録/解除をバックエンドと同期する
  targetReservation = await syncAutoDialJob(targetReservation);

  if (editingId) {
    list = list.map(r => r.id === editingId ? targetReservation : r);
  } else {
    list.push(targetReservation);
  }

  // 「未予約」の枠は正式な予約ではないため、Googleカレンダーへは反映しない
  if (targetReservation.status !== "pending") {
    const gcalEventId = await pushToCalendar(targetReservation);
    if (gcalEventId) {
      list = list.map(r => r.id === targetReservation.id ? Object.assign({}, r, { gcalEventId }) : r);
    }
  }

  saveReservations(list);
  saveBtn.disabled = false;
  resetForm();
  render();
});

async function deleteReservation(id) {
  if (!confirm("この予約を削除しますか？")) return;
  let list = loadReservations();
  const target = list.find(x => x.id === id);
  if (target && target.gcalEventId) {
    await deleteFromCalendar(target.gcalEventId);
  }
  if (target && target.callJobId) {
    const apiBase = loadApiBaseUrl();
    if (apiBase) {
      try {
        await fetch(`${apiBase}/jobs/${target.callJobId}`, { method: "DELETE" });
      } catch (e) {
        // 失敗しても削除自体は続行する
      }
    }
  }
  list = list.filter(x => x.id !== id);
  saveReservations(list);
  render();
}

document.querySelectorAll(".tab-btn").forEach(btn => {

    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

function render() {
  refreshCourseFilterOptions();
  let list = loadReservations();
  list.sort((a, b) => (a.playDate + a.startTime).localeCompare(b.playDate + b.startTime));

  const today = todayStr();

  if (currentFilter === "upcoming") {
    list = list.filter(r => r.playDate >= today);
  } else if (currentFilter === "changeRequested") {
    list = list.filter(r => r.timeChangeRequested);
  } else if (currentFilter === "pending") {
    list = list.filter(r => r.status === "pending");
  }

  if (currentCourseFilter) {
    list = list.filter(r => r.course === currentCourseFilter);
  }

  const container = document.getElementById("resList");
  const emptyMsg = document.getElementById("emptyMsg");
  container.innerHTML = "";

  if (list.length === 0) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  const jobLabelMap = {
    scheduled: "発信待機中",
    dialing: "発信中",
    connected: "接続成功",
    failed: "失敗",
    cancelled: "取消済み"
  };

  list.forEach(r => {
    const item = document.createElement("div");
    item.className = "res-item" + (r.playDate < today ? " past" : "");

    const main = document.createElement("div");
    main.className = "res-main";

    const dateLine = document.createElement("div");
    dateLine.className = "date-line";
    if (r.course) {
      const courseTag = document.createElement("span");
      courseTag.className = "course-tag";
      courseTag.textContent = r.course;
      dateLine.appendChild(courseTag);
    }
    dateLine.appendChild(document.createTextNode(`${formatDateLabel(r.playDate)} ${r.startTime}〜`));
    if (r.status === "pending") {
      const pill = document.createElement("span");
      pill.className = "status-pill pending";
      pill.textContent = "未予約";
      dateLine.appendChild(pill);
    }
    if (r.timeChangeRequested) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "変更依頼あり";
      dateLine.appendChild(badge);
    }
    if (r.gcalEventId) {
      const tag = document.createElement("span");
      tag.className = "sync-tag";
      tag.textContent = "カレンダー同期済み";
      dateLine.appendChild(tag);
    }
    if (r.callJobId) {
      const jobBadge = document.createElement("span");
      jobBadge.className = "calljob-badge " + (r.callJobStatus || "scheduled");
      jobBadge.textContent = "自動発信: " + (jobLabelMap[r.callJobStatus] || r.callJobStatus || "登録済み");
      dateLine.appendChild(jobBadge);
    }

    const subLine = document.createElement("div");
    subLine.className = "sub-line";
    const playerNames = (r.players || [r.companions || ""]).filter(n => n && n.trim());
    let subText = playerNames.length ? `プレーヤー: ${playerNames.join("、")}` : "プレーヤー: なし";
    if (r.timeChangeRequested && r.timeChangeNote) {
      subText += `　／　${r.timeChangeNote}`;
    }
    subLine.textContent = subText;

    main.appendChild(dateLine);
    main.appendChild(subLine);

    const actions = document.createElement("div");
    actions.className = "res-actions";

    if (r.callJobId) {
      const refreshBtn = document.createElement("button");
      refreshBtn.className = "icon-btn";
      refreshBtn.textContent = "状況更新";
      refreshBtn.addEventListener("click", () => refreshJobStatus(r.id));
      actions.appendChild(refreshBtn);
    }

    const editBtn = document.createElement("button");
    editBtn.className = "icon-btn";
    editBtn.textContent = "編集";
    editBtn.addEventListener("click", () => startEdit(r.id));

    const delBtn = document.createElement("button");
    delBtn.className = "icon-btn delete";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", () => deleteReservation(r.id));

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    item.appendChild(main);
    item.appendChild(actions);
    container.appendChild(item);
  });
}
